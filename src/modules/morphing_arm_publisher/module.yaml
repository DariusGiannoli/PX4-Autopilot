module_name: Morphing Arm Publisher
parameters:
    - group: Morphing Arms
      definitions:
        MORPH_PUB_EN:
            description:
                short: Enable calibrated MAVLink arm publisher
                long: Enable only after measuring calibration and configuring matching peripheral outputs for the selected MARM_MODEL. No RC AUX support or arming interlock. Disabling stops angle publication, not servo outputs.
            type: boolean
            default: 0
        MORPH_PUB_TMO:
            description:
                short: Arm command stale timeout
                long: Warn and require all four targets again after this interval without a valid arm update. Does not move servos or change the allocator hold-last policy. Restart publisher after changing.
            type: float
            unit: s
            min: 0.1
            max: 10.0
            default: 1.0
            reboot_required: true
        MARM_MODEL:
            description:
                short: Arm mapping model
                long: 0 uses legacy FR RR RL FL three-point calibration. 1 uses the shared measured FR model with actuator sets FR RL FL RR, MAIN 7 6 8 5, neutral 1450 and PWM 1150..1750. Restart from physical neutral after changing. No measured feedback; bench dynamics exclude host/mocap delay.
            type: enum
            values:
                0: Legacy three-point
                1: Shared FR measured model
            default: 0
            reboot_required: true
        MARM_CAL_ID:
            description:
                short: Compiled measured arm calibration ID
                long: Must match the compiled model and host configuration. Do not change manually to bypass a version mismatch.
            type: int32
            min: 1210830
            max: 1210830
            default: 1210830
            reboot_required: true
        MARM_FR_DIR:
            description:
                short: FR increasing PWM to CAD angle sign
                long: Measured model only. Verify physical CAD positive rotation. Host inverse mapping must use the same sign. Restart after changing.
            type: int32
            min: -1
            max: 1
            default: 1
            reboot_required: true
        MARM_RR_DIR:
            description:
                short: RR increasing PWM to CAD angle sign
                long: Measured model only. Verify physical CAD positive rotation. Host inverse mapping must use the same sign. Restart after changing.
            type: int32
            min: -1
            max: 1
            default: 1
            reboot_required: true
        MARM_RL_DIR:
            description:
                short: RL increasing PWM to CAD angle sign
                long: Measured model only. Verify physical CAD positive rotation. Host inverse mapping must use the same sign. Restart after changing.
            type: int32
            min: -1
            max: 1
            default: 1
            reboot_required: true
        MARM_FL_DIR:
            description:
                short: FL increasing PWM to CAD angle sign
                long: Measured model only. Verify physical CAD positive rotation. Host inverse mapping must use the same sign. Restart after changing.
            type: int32
            min: -1
            max: 1
            default: 1
            reboot_required: true
        MARM_FR_NEG:
            description:
                short: FR measured arm angle at command -1
                long: Degrees from CAD neutral at normalized peripheral command -1, including output scaling and linkage. All three points must be strictly monotonic. Zero defaults are uncalibrated and prevent startup. Restart publisher after changing.
            type: float
            unit: deg
            min: -30.0
            max: 30.0
            decimal: 3
            default: 0.0
            reboot_required: true
        MARM_FR_ZERO:
            description:
                short: FR measured arm angle at center command
                long: Degrees from CAD neutral at the normalized command selected by the corresponding MARM_*_CTR parameter, including output scaling and linkage. All three points must be strictly monotonic. Zero defaults are uncalibrated and prevent startup. Restart publisher after changing.
            type: float
            unit: deg
            min: -30.0
            max: 30.0
            decimal: 3
            default: 0.0
            reboot_required: true
        MARM_FR_POS:
            description:
                short: FR measured arm angle at command +1
                long: Degrees from CAD neutral at normalized peripheral command +1, including output scaling and linkage. All three points must be strictly monotonic. Zero defaults are uncalibrated and prevent startup. Restart publisher after changing.
            type: float
            unit: deg
            min: -30.0
            max: 30.0
            decimal: 3
            default: 0.0
            reboot_required: true
        MARM_RR_NEG:
            description:
                short: RR measured arm angle at command -1
                long: Degrees from CAD neutral at normalized peripheral command -1, including output scaling and linkage. All three points must be strictly monotonic. Zero defaults are uncalibrated and prevent startup. Restart publisher after changing.
            type: float
