        MARM_RR_ZERO:
            description:
                short: RR measured arm angle at center command
                long: Degrees from CAD neutral at the normalized command selected by the corresponding MARM_*_CTR parameter, including output scaling and linkage. All three points must be strictly monotonic. Zero defaults are uncalibrated and prevent startup. Restart publisher after changing.
            type: float
            unit: deg
            min: -30.0
            max: 30.0
            decimal: 3
            default: 0.0
            reboot_required: true
        MARM_RR_POS:
            description:
                short: RR measured arm angle at command +1
                long: Degrees from CAD neutral at normalized peripheral command +1, including output scaling and linkage. All three points must be strictly monotonic. Zero defaults are uncalibrated and prevent startup. Restart publisher after changing.
            type: float
            unit: deg
            min: -30.0
            max: 30.0
            decimal: 3
            default: 0.0
            reboot_required: true
        MARM_RL_NEG:
