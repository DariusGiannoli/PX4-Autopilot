                short: FL measured arm angle at command +1
                long: Degrees from CAD neutral at normalized peripheral command +1, including output scaling and linkage. All three points must be strictly monotonic. Zero defaults are uncalibrated and prevent startup. Restart publisher after changing.
            type: float
            unit: deg
            min: -30.0
            max: 30.0
            decimal: 3
            default: 0.0
            reboot_required: true
        MARM_FR_CTR:
            description:
                short: FR normalized center command
                long: Command corresponding to MARM_FR_ZERO. For mechanical neutral set ZERO to 0 degrees and CTR to the normalized command producing that pose. Default 0 preserves midpoint calibration. Restart publisher after changing.
            type: float
            min: -0.99
            max: 0.99
            decimal: 4
            default: 0.0
